<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F54}a:hover{color:#14463A}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 860px; background: #F6F7F5; color: #14201C; font-family: 'Inter', system-ui, sans-serif">
<nav style="flex: 0 0 232px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E3E7E3; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
<div style="width: 36px; height: 36px; border-radius: 8px; background: #1F6F54; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">T</div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Tawi</span><span style="font-size: 12px; color: #4A5750">Admin</span></div>
</div>
<a href="Main.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #3C4A44; text-decoration: none; font-size: 15px; font-weight: 500">Dashboard</a>
<a href="Inbox.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #3C4A44; text-decoration: none; font-size: 15px; font-weight: 500">Inbox</a>
<a href="Founders.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #3C4A44; text-decoration: none; font-size: 15px; font-weight: 500">Founders</a>
<a href="Services.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #3C4A44; text-decoration: none; font-size: 15px; font-weight: 500">Services</a>
<a href="Customers.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; background: #E4F0EA; color: #14463A; text-decoration: none; font-size: 15px; font-weight: 600">Customers</a>
<a href="Settings.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #3C4A44; text-decoration: none; font-size: 15px; font-weight: 500">Settings</a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Customers</h1>
<span style="font-size: 15px; color: #4A5750">Track every business from first contact to paying customer.</span>
</div>
<button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #1F6F54; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit">Add customer</button>
</header>
<section style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<sc-for list="{{stages}}" as="st" hint-placeholder-count="4">
<div style="flex: 1 1 220px; min-width: 0; box-sizing: border-box; background: #EDF0ED; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">{{st.name}}</h2>
<span style="font-size: 13px; color: #4A5750">{{st.count}}</span>
</div>
<sc-if value="{{st.hasCard}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E7E3; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">Business name</span>
<span style="font-size: 13px; color: #4A5750">Contact person · Service</span>
</div>
</sc-if>
<span style="font-size: 14px; color: #4A5750; padding: 8px 4px">{{st.empty}}</span>
</div>
</sc-for>
</section>
<section style="box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E7E3; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Customer details</h2>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
<label for="c-name" style="font-size: 14px; font-weight: 500">Business name</label>
<input id="c-name" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8C9A92; border-radius: 8px; font-size: 15px; font-family: inherit">
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
<label for="c-contact" style="font-size: 14px; font-weight: 500">Contact person and phone</label>
<input id="c-contact" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8C9A92; border-radius: 8px; font-size: 15px; font-family: inherit">
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
<label for="c-service" style="font-size: 14px; font-weight: 500">Service of interest</label>
<input id="c-service" type="text" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8C9A92; border-radius: 8px; font-size: 15px; font-family: inherit">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-notes" style="font-size: 14px; font-weight: 500">Notes and feedback</label>
<textarea id="c-notes" rows="3" style="box-sizing: border-box; padding: 10px 12px; border: 1px solid #8C9A92; border-radius: 8px; font-size: 15px; font-family: inherit; resize: vertical"></textarea>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return {
stages: [
{ name: 'Lead', count: '0', hasCard: false, empty: 'No businesses here yet.' },
{ name: 'Contacted', count: '0', hasCard: false, empty: 'No businesses here yet.' },
{ name: 'Pilot', count: '0', hasCard: false, empty: 'No businesses here yet.' },
{ name: 'Customer', count: '0', hasCard: false, empty: 'No businesses here yet.' }
]
};
}
}
</script>
</body>
</html>
