<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F54}a:hover{color:#14463A}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 1100px; background: #FFFFFF; color: #14201C; font-family: 'Inter', system-ui, sans-serif">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 48px; border-bottom: 1px solid #E3E7E3">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #14201C">
<span style="width: 36px; height: 36px; border-radius: 8px; background: #1F6F54; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">T</span>
<span style="font-weight: 700; font-size: 16px">Tawi Digital Solutions</span>
</a>
<nav style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<a href="Main.dc.html" style="padding: 12px 14px; color: #3C4A44; font-weight: 500; font-size: 15px; text-decoration: none">Home</a>
<a href="Services.dc.html" style="padding: 12px 14px; color: #14463A; font-weight: 600; font-size: 15px; text-decoration: none">Services</a>
<a href="Team.dc.html" style="padding: 12px 14px; color: #3C4A44; font-weight: 500; font-size: 15px; text-decoration: none">Team</a>
<a href="Request.dc.html" style="display: inline-block; padding: 12px 18px; border-radius: 8px; background: #1F6F54; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">Request details</a>
</nav>
</header>
<section style="background: #F6F7F5; padding: 64px 48px">
<div style="max-width: 1080px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 40px; font-weight: 700">Our services</h1>
<p style="margin: 0; max-width: 620px; font-size: 18px; line-height: 1.5; color: #3C4A44">Choose a service to ask for more details. We will contact you on WhatsApp.</p>
</div>
</section>
<section style="padding: 56px 48px 72px">
<div style="max-width: 1080px; width: 100%; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px">
<sc-for list="{{services}}" as="s" hint-placeholder-count="5">
<div style="flex: 1 1 320px; min-width: 0; box-sizing: border-box; border: 1px solid #E3E7E3; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; font-weight: 600">{{s.name}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3C4A44">{{s.note}}</p>
<a href="Request.dc.html" style="display: inline-block; align-self: flex-start; margin-top: 8px; padding: 12px 18px; border-radius: 8px; background: #1F6F54; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">Request details</a>
</div>
</sc-for>
</div>
</section>
<footer style="margin-top: auto; background: #14201C; padding: 40px 48px; color: #C9D3CE">
<div style="max-width: 1080px; width: 100%; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; color: #FFFFFF">Tawi Digital Solutions</span>
<span style="font-size: 14px">Practical digital solutions. Built together.</span>
</div>
<span style="font-size: 14px">hello@example.com</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
return {
services: [
{ name: 'QR digital menus', note: 'Mobile-friendly menus for restaurants and hotels, opened with a QR code.' },
{ name: 'Website development', note: 'Websites and landing pages for businesses and individuals.' },
{ name: 'AI-assisted business solutions', note: 'Help using tools such as ChatGPT and Claude to improve workflows and customer communication.' },
{ name: 'Digital business cards', note: 'QR-enabled digital profiles that make it easy to share your details.' },
{ name: 'Promotional video and content', note: 'Short promotional videos, adverts and social media content.' }
]
};
}
}
</script>
</body>
</html>
